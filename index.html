<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#0a0f1e"/>
<title>Never Lost</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0f1e;--surface:#111827;--surface2:#1f2937;--border:#374151;--green:#22c55e;--blue:#3b82f6;--yellow:#f59e0b;--red:#ef4444;--text:#f9fafb;--muted:#9ca3af}
html,body{height:100%;width:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden;touch-action:manipulation;font-size:14px}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
#header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
#header h1{font-size:16px;font-weight:700;letter-spacing:1px;color:var(--green)}
#header h1 span{color:var(--text)}
#status-dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
#status-dot.active{background:var(--green);box-shadow:0 0 6px var(--green)}
#compass-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;min-height:0;overflow:hidden}
#compass-ring{position:relative;width:min(60vw,230px);height:min(60vw,230px);flex-shrink:0;transition:transform 0.2s ease-out}
#compass-ring::before{content:'';position:absolute;inset:0;border-radius:50%;border:3px solid var(--border);background:radial-gradient(circle at 50% 50%,#141c2f 60%,#0d1220)}
.cardinal{position:absolute;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);transform:translate(-50%,-50%)}
.cardinal.N{top:6%;left:50%;color:var(--red)}
.cardinal.S{top:94%;left:50%}
.cardinal.E{top:50%;left:94%}
.cardinal.W{top:50%;left:6%}
#tick-canvas{position:absolute;inset:0;border-radius:50%}
#arrow-svg{position:absolute;top:50%;left:50%;width:55%;height:55%;transform:translate(-50%,-50%) rotate(0deg);transition:transform 0.3s ease-out;filter:drop-shadow(0 0 10px rgba(34,197,94,0.7));z-index:5}
#center-dot{position:absolute;top:50%;left:50%;width:14px;height:14px;border-radius:50%;background:var(--surface2);border:2px solid var(--border);transform:translate(-50%,-50%);z-index:10}
#distance-badge{margin-top:6px;background:var(--surface2);border:1px solid var(--border);border-radius:100px;padding:6px 20px;text-align:center}
#distance-val{font-size:28px;font-weight:800;color:var(--green);line-height:1}
#distance-unit{font-size:11px;color:var(--muted)}
#target-label{font-size:10px;color:var(--blue);margin-top:2px;text-transform:uppercase;letter-spacing:.5px}
#info-row{display:flex;gap:6px;margin-top:6px;flex-shrink:0;flex-wrap:wrap;justify-content:center}
.info-chip{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:10px;color:var(--muted);text-align:center;line-height:1.3}
.info-chip span{display:block;font-size:12px;font-weight:600;color:var(--text)}
#bottom-panel{background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;max-height:40vh;overflow-y:auto}
#tab-bar{display:flex;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:5}
.tab-btn{flex:1;padding:8px 4px;background:none;border:none;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent}
.tab-btn.active{color:var(--green);border-bottom-color:var(--green)}
.tab-content{display:none;padding:10px 12px}
.tab-content.active{display:block}
.btn{width:100%;padding:10px;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:.3px}
.btn:active{transform:scale(.97);opacity:.85}
.btn-green{background:var(--green);color:#000}
.btn-blue{background:var(--blue);color:#fff}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
#wp-list{max-height:100px;overflow-y:auto;margin-top:8px}
.wp-item{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 8px;margin-bottom:4px;cursor:pointer;font-size:12px}
.wp-item.selected{border-color:var(--blue)}
.wp-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.wp-info{flex:1;min-width:0}
.wp-name{font-size:12px;font-weight:600}
.wp-dist{font-size:10px;color:var(--muted)}
.wp-del{background:none;border:none;color:var(--muted);font-size:14px;cursor:pointer;padding:2px}
#wp-form{display:none;margin-top:8px;gap:6px}
#wp-form.open{display:flex}
#wp-name-input{flex:1;padding:8px 10px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:13px}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.toggle{width:40px;height:22px;border-radius:100px;background:var(--border);border:none;cursor:pointer;position:relative}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:white;transition:transform .2s}
.toggle.on{background:var(--green)}
.toggle.on::after{transform:translateX(18px)}
#permission-overlay{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:12px}
#permission-overlay.hidden{display:none}
.perm-icon{font-size:48px}
#permission-overlay h2{font-size:22px;font-weight:800}
#permission-overlay p{color:var(--muted);font-size:14px;line-height:1.5}
#cal-banner{display:none;background:rgba(245,158,11,.15);padding:4px 10px;font-size:11px;color:var(--yellow);text-align:center}
#cal-banner.show{display:block}
@keyframes pulse-ring{0%{transform:translate(-50%,-50%) scale(1);opacity:.8}100%{transform:translate(-50%,-50%) scale(1.5);opacity:0}}
#pulse{position:absolute;top:50%;left:50%;width:50%;height:50%;border-radius:50%;border:2px solid var(--green);transform:translate(-50%,-50%);opacity:0;pointer-events:none}
#pulse.pulse{animation:pulse-ring 1s ease-out infinite}
</style>
</head>
<body>
<div id="permission-overlay">
<div class="perm-icon">🧭</div>
<h2>Never Lost</h2>
<p>GPS & compass access needed.<br>Your data stays on device.</p>
<button class="btn btn-green" id="enable-btn" style="max-width:280px">Enable GPS & Compass</button>
<p id="status-msg" style="font-size:12px;color:var(--muted);margin-top:8px"></p>
</div>
<div id="app">
<div id="header"><h1>NEVER <span>LOST</span></h1><div style="display:flex;align-items:center;gap:8px"><span id="accuracy-txt" style="font-size:10px;color:var(--muted)">--</span><div id="status-dot"></div></div></div>
<div id="cal-banner">⚠️ Figure-8 to calibrate</div>
<div id="compass-wrap">
<div id="compass-ring">
<canvas id="tick-canvas"></canvas>
<span class="cardinal N">N</span><span class="cardinal S">S</span><span class="cardinal E">E</span><span class="cardinal W">W</span>
<div id="pulse"></div>
<svg id="arrow-svg" viewBox="0 0 100 100"><polygon points="50,8 62,55 50,48 38,55" fill="#22c55e"/><polygon points="50,92 62,55 50,62 38,55" fill="rgba(34,197,94,0.35)"/><circle cx="50" cy="10" r="4" fill="#86efac"/></svg>
<div id="center-dot"></div>
</div>
<div id="distance-badge"><div id="distance-val">---</div><div id="distance-unit">feet</div><div id="target-label">No target set</div></div>
<div id="info-row">
<div class="info-chip">Heading<span id="heading-val">---°</span></div>
<div class="info-chip">Bearing<span id="bearing-val">---°</span></div>
<div class="info-chip">Lat<span id="lat-val">---</span></div>
<div class="info-chip">Lon<span id="lon-val">---</span></div>
</div>
</div>
<div id="bottom-panel">
<div id="tab-bar">
<button class="tab-btn active" onclick="switchTab('home-tab',this)">🏠 Home</button>
<button class="tab-btn" onclick="switchTab('waypoints-tab',this)">📍 Waypoints</button>
<button class="tab-btn" onclick="switchTab('settings-tab',this)">⚙️ Settings</button>
</div>
<div id="home-tab" class="tab-content active">
<button class="btn btn-green" onclick="setHome()">📍 Set Home Point Here</button>
<div id="home-info" style="margin-top:8px;font-size:11px;color:var(--muted);text-align:center"></div>
<button id="nav-home-btn" class="btn btn-outline" style="margin-top:6px;display:none" onclick="navigateTo('home')">🏠 Navigate to Home</button>
</div>
<div id="waypoints-tab" class="tab-content">
<button class="btn btn-blue" onclick="toggleWpForm()">+ Add Waypoint Here</button>
<div id="wp-form"><input id="wp-name-input" placeholder="Name…" maxlength="30" autocomplete="off"/><button class="btn btn-blue" style="width:auto;padding:8px 14px;font-size:13px" onclick="saveWaypoint()">Save</button></div>
<div id="wp-list"></div>
<div id="wp-empty" style="margin-top:8px;font-size:12px;color:var(--muted);text-align:center;display:none">No waypoints yet.</div>
</div>
<div id="settings-tab" class="tab-content">
<div class="setting-row"><span>Distance Unit</span><div style="display:flex;gap:6px"><button id="unit-ft" class="btn btn-green" style="width:auto;padding:5px 12px;font-size:12px" onclick="setUnit('ft')">Feet</button><button id="unit-m" class="btn btn-outline" style="width:auto;padding:5px 12px;font-size:12px" onclick="setUnit('m')">Meters</button></div></div>
<div class="setting-row"><span>Compass Smoothing</span><button id="smooth-toggle" class="toggle on" onclick="toggleSmooth()"></button></div>
<div class="setting-row"><span>Near Alert (vibrate)</span><button id="vibe-toggle" class="toggle on" onclick="toggleVibe()"></button></div>
<div class="setting-row"><span>High Accuracy GPS</span><button id="acc-toggle" class="toggle on" onclick="toggleAccuracy()"></button></div>
<button class="btn btn-outline" style="margin-top:8px;color:var(--red);border-color:var(--red)" onclick="clearAll()">🗑 Clear All Data</button>
</div>
</div>
</div>
<script>
let state={lat:null,lon:null,heading:0,home:null,waypoints:[],targetId:null,unit:'ft',smooth:true,vibe:true,highAcc:true,gpsWatch:null,smoothHeading:0};
const WP_COLORS=['#3b82f6','#f59e0b','#ec4899','#8b5cf6','#06b6d4','#f97316'];

window.addEventListener('DOMContentLoaded',()=>{
  loadState();drawTicks();renderWaypointList();updateHomeInfo();
  document.getElementById('enable-btn').addEventListener('click',requestPermissions);
});

async function requestPermissions(){
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
    try{await DeviceOrientationEvent.requestPermission()}catch(e){}
  }
  startCompass();startGPS();
  document.getElementById('permission-overlay').classList.add('hidden');
}

function startGPS(){
  if(!navigator.geolocation)return;
  if(state.gpsWatch!==null)navigator.geolocation.clearWatch(state.gpsWatch);
  state.gpsWatch=navigator.geolocation.watchPosition(onGPS,onGPSError,{enableHighAccuracy:state.highAcc,maximumAge:2000,timeout:15000});
}
function restartGPS(){if(state.gpsWatch!==null)navigator.geolocation.clearWatch(state.gpsWatch);startGPS()}
function onGPS(pos){
  state.lat=pos.coords.latitude;state.lon=pos.coords.longitude;
  document.getElementById('status-dot').className='active';
  document.getElementById('accuracy-txt').textContent='±'+Math.round(pos.coords.accuracy)+'m';
  document.getElementById('lat-val').textContent=state.lat.toFixed(5);
  document.getElementById('lon-val').textContent=state.lon.toFixed(5);
  updateArrow();updateWaypointDistances();nearAlert();
}
function onGPSError(e){document.getElementById('status-dot').className='warn'}

function startCompass(){
  document.getElementById('cal-banner').classList.add('show');
  setTimeout(()=>document.getElementById('cal-banner').classList.remove('show'),8000);
  window.addEventListener('deviceorientationabsolute',handleOrientation,true);
  window.addEventListener('deviceorientation',handleOrientation,true);
}

function handleOrientation(e){
  let h=null;
  if(e.webkitCompassHeading!==undefined)h=e.webkitCompassHeading;
  else if(e.absolute&&e.alpha!==null)h=(360-e.alpha)%360;
  else if(e.alpha!==null)h=(360-e.alpha)%360;
  if(h===null)return;
  if(state.smooth){
    if(!state.smoothHeading)state.smoothHeading=h;
    state.smoothHeading=circularLerp(state.smoothHeading,h,0.12);
    state.heading=state.smoothHeading;
  }else{state.heading=h}
  document.getElementById('heading-val').textContent=Math.round(state.heading)+'°';
  updateCompassRing();
  updateArrow();
}

function circularLerp(a,b,t){let diff=b-a;while(diff>180)diff-=360;while(diff<-180)diff+=360;return(a+diff*t+360)%360}

function updateCompassRing(){
  let ring=document.getElementById('compass-ring');
  ring.style.transform='rotate('+(-state.heading)+'deg)';
}

function updateArrow(){
  let target=getTarget();let svg=document.getElementById('arrow-svg');
  if(!target||state.lat===null){
    svg.style.transform='translate(-50%,-50%) rotate(0deg)';
    document.getElementById('distance-val').textContent='---';
    document.getElementById('bearing-val').textContent='---°';
    return;
  }
  let bearing=computeBearing(state.lat,state.lon,target.lat,target.lon);
  let dist=computeDistance(state.lat,state.lon,target.lat,target.lon);
  // Arrow points to target relative to screen (bearing rotated by compass ring)
  svg.style.transform='translate(-50%,-50%) rotate('+bearing+'deg)';
  let distDisplay;
  if(state.unit==='ft'){
    let ft=dist*3.28084;
    distDisplay=ft<15?'0':Math.round(ft);
  }else{
    distDisplay=dist<5?'0':(dist>=1000?(dist/1000).toFixed(1)+' km':Math.round(dist));
  }
  document.getElementById('distance-val').textContent=distDisplay;
  document.getElementById('distance-unit').textContent=state.unit==='ft'?'feet':'meters';
  document.getElementById('bearing-val').textContent=Math.round(bearing)+'°';
}

let lastNearAlert=0;
function nearAlert(){
  let target=getTarget();if(!target||state.lat===null){document.getElementById('pulse').classList.remove('pulse');return}
  let dist=computeDistance(state.lat,state.lon,target.lat,target.lon);
  if(dist<=8){document.getElementById('pulse').classList.add('pulse');let now=Date.now();if(state.vibe&&now-lastNearAlert>3000&&navigator.vibrate){navigator.vibrate([200,100,200]);lastNearAlert=now}}
  else document.getElementById('pulse').classList.remove('pulse')
}
function setHome(){if(state.lat===null){alert('Wait for GPS lock');return}state.home={lat:state.lat,lon:state.lon};state.targetId='home';saveState();updateHomeInfo();updateArrow();document.getElementById('target-label').textContent='🏠 Home';haptic()}
function updateHomeInfo(){let el=document.getElementById('home-info');let btn=document.getElementById('nav-home-btn');if(state.home){el.textContent='Home: '+state.home.lat.toFixed(5)+', '+state.home.lon.toFixed(5);btn.style.display='block'}else{el.textContent='Stand at start point, tap above.';btn.style.display='none'}}
function toggleWpForm(){let f=document.getElementById('wp-form');f.classList.toggle('open');if(f.classList.contains('open'))document.getElementById('wp-name-input').focus()}
function saveWaypoint(){if(state.lat===null){alert('Wait for GPS lock');return}let name=document.getElementById('wp-name-input').value.trim()||'WP'+(state.waypoints.length+1);let color=WP_COLORS[state.waypoints.length%WP_COLORS.length];let wp={id:Date.now().toString(),name:name,lat:state.lat,lon:state.lon,color:color};state.waypoints.push(wp);state.targetId=wp.id;document.getElementById('wp-name-input').value='';document.getElementById('wp-form').classList.remove('open');saveState();renderWaypointList();updateArrow();document.getElementById('target-label').textContent='📍 '+name;haptic()}
function navigateTo(id){state.targetId=id;saveState();updateArrow();let target=getTarget();document.getElementById('target-label').textContent=id==='home'?'🏠 Home':'📍 '+(target?target.name:'');renderWaypointList();switchTab('home-tab',document.querySelector('.tab-btn'));haptic()}
function deleteWaypoint(id,e){e.stopPropagation();state.waypoints=state.waypoints.filter(w=>w.id!==id);if(state.targetId===id)state.targetId=state.home?'home':null;saveState();renderWaypointList();updateArrow()}
function renderWaypointList(){let list=document.getElementById('wp-list');let empty=document.getElementById('wp-empty');list.innerHTML='';if(state.home){let dist=state.lat?computeDistance(state.lat,state.lon,state.home.lat,state.home.lon):null;list.appendChild(makeWpItem('home','🏠 Home','#22c55e',dist,state.targetId==='home'))}state.waypoints.forEach(wp=>{let dist=state.lat?computeDistance(state.lat,state.lon,wp.lat,wp.lon):null;list.appendChild(makeWpItem(wp.id,wp.name,wp.color,dist,state.targetId===wp.id,wp.id))});empty.style.display=(!state.home&&state.waypoints.length===0)?'block':'none'}
function makeWpItem(id,name,color,dist,selected,deleteId){let item=document.createElement('div');item.className='wp-item'+(selected?' selected':'');item.onclick=()=>navigateTo(id);let distText='';if(dist!==null){let ft=dist*3.28084;distText=state.unit==='ft'?(ft<15?'Here':Math.round(ft)+' ft'):(dist<5?'Here':(dist>=1000?(dist/1000).toFixed(1)+' km':Math.round(dist)+' m'))}item.innerHTML='<div class="wp-dot" style="background:'+color+'"></div><div class="wp-info"><div class="wp-name">'+name+'</div><div class="wp-dist">'+(distText||'No GPS')+'</div></div>'+(selected?'<span style="color:var(--green)">▶</span>':'')+(deleteId?'<button class="wp-del" onclick="deleteWaypoint(\''+deleteId+'\',event)">✕</button>':'');return item}
function updateWaypointDistances(){renderWaypointList()}
function getTarget(){if(!state.targetId)return null;if(state.targetId==='home')return state.home;return state.waypoints.find(w=>w.id===state.targetId)||null}
function computeBearing(a,b,c,d){let toRad=x=>x*Math.PI/180;let dLon=toRad(d-b);let y=Math.sin(dLon)*Math.cos(toRad(c));let x=Math.cos(toRad(a))*Math.sin(toRad(c))-Math.sin(toRad(a))*Math.cos(toRad(c))*Math.cos(dLon);return(Math.atan2(y,x)*180/Math.PI+360)%360}
function computeDistance(a,b,c,d){let R=6371000;let toRad=x=>x*Math.PI/180;let dLat=toRad(c-a),dLon=toRad(d-b);let e=Math.sin(dLat/2)**2+Math.cos(toRad(a))*Math.cos(toRad(c))*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(e),Math.sqrt(1-e))}
function drawTicks(){let canvas=document.getElementById('tick-canvas');let ring=document.getElementById('compass-ring');let size=ring.offsetWidth||230;canvas.width=size;canvas.height=size;let ctx=canvas.getContext('2d');let cx=size/2,cy=size/2,r=size/2-6;for(let i=0;i<360;i+=5){let ang=(i-90)*Math.PI/180;let isMajor=i%45===0;let len=isMajor?12:(i%15===0?7:3);ctx.beginPath();ctx.moveTo(cx+(r-len)*Math.cos(ang),cy+(r-len)*Math.sin(ang));ctx.lineTo(cx+r*Math.cos(ang),cy+r*Math.sin(ang));ctx.strokeStyle=isMajor?'#6b7280':'#374151';ctx.lineWidth=isMajor?2:1;ctx.stroke()}}
function haptic(){if(navigator.vibrate)navigator.vibrate(50)}
function setUnit(u){state.unit=u;document.getElementById('unit-ft').className='btn '+(u==='ft'?'btn-green':'btn-outline');document.getElementById('unit-m').className='btn '+(u==='m'?'btn-green':'btn-outline');document.getElementById('unit-ft').style.cssText='width:auto;padding:5px 12px;font-size:12px';document.getElementById('unit-m').style.cssText='width:auto;padding:5px 12px;font-size:12px';saveState();updateArrow();renderWaypointList()}
function toggleSmooth(){state.smooth=!state.smooth;document.getElementById('smooth-toggle').className='toggle'+(state.smooth?' on':'');saveState()}
function toggleVibe(){state.vibe=!state.vibe;document.getElementById('vibe-toggle').className='toggle'+(state.vibe?' on':'');saveState()}
function toggleAccuracy(){state.highAcc=!state.highAcc;document.getElementById('acc-toggle').className='toggle'+(state.highAcc?' on':'');saveState();restartGPS()}
function clearAll(){if(!confirm('Clear all?'))return;state.home=null;state.waypoints=[];state.targetId=null;saveState();renderWaypointList();updateHomeInfo();updateArrow();document.getElementById('target-label').textContent='No target';document.getElementById('distance-val').textContent='---'}
function switchTab(id,btn){document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));document.getElementById(id).classList.add('active');btn.classList.add('active');if(id==='waypoints-tab')renderWaypointList()}
function saveState(){localStorage.setItem('nl',JSON.stringify({home:state.home,waypoints:state.waypoints,targetId:state.targetId,unit:state.unit,smooth:state.smooth,vibe:state.vibe,highAcc:state.highAcc}))}
function loadState(){try{let s=JSON.parse(localStorage.getItem('nl')||'{}');if(s.home)state.home=s.home;if(s.waypoints)state.waypoints=s.waypoints;if(s.targetId)state.targetId=s.targetId;if(s.unit)state.unit=s.unit;if(s.smooth!==undefined)state.smooth=s.smooth;if(s.vibe!==undefined)state.vibe=s.vibe;if(s.highAcc!==undefined)state.highAcc=s.highAcc}catch(e){}setUnit(state.unit);document.getElementById('smooth-toggle').className='toggle'+(state.smooth?' on':'');document.getElementById('vibe-toggle').className='toggle'+(state.vibe?' on':'');document.getElementById('acc-toggle').className='toggle'+(state.highAcc?' on':'')}
window.addEventListener('resize',()=>setTimeout(drawTicks,200));
</script>
</body>
</html>
