<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="screen-orientation" content="portrait">
    <title>NEVER LOST</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #0a0f1e 0%, #0c1222 100%);
            font-family: 'Segoe UI', 'SF Pro', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        /* Main App Container */
        .app-container {
            max-width: 480px;
            width: 100%;
            background: rgba(18, 25, 45, 0.75);
            backdrop-filter: blur(20px);
            border-radius: 56px;
            padding: 24px 20px 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Header */
        .brand {
            text-align: center;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #fff 0%, #7f8fa6 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .tag {
            color: #5f7f9e;
            font-size: 12px;
            letter-spacing: 3px;
            margin-top: 4px;
        }

        /* Compass Rose & Arrow */
        .compass-panel {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 120px;
            padding: 16px 12px;
            margin-bottom: 24px;
            backdrop-filter: blur(8px);
        }
        .arrow-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 140px;
            position: relative;
        }
        .compass-arrow {
            width: 80px;
            height: 80px;
            background: radial-gradient(circle at 30% 35%, #2c3e66, #0e1628);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
            transition: transform 0.1s ease-out;
        }
        .arrow-symbol {
            font-size: 48px;
            filter: drop-shadow(0 2px 5px black);
        }
        .bearing-digits {
            text-align: center;
            margin-top: 12px;
        }
        .bearing-digits span:first-child {
            color: #94a3b8;
            font-size: 14px;
        }
        .bearing-digits strong {
            font-size: 28px;
            color: #e2e8f0;
            font-family: monospace;
        }

        /* Info Grid */
        .info-grid {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 32px;
            padding: 14px 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .info-card {
            text-align: center;
            flex: 1;
        }
        .info-label {
            font-size: 11px;
            color: #6c86a3;
            letter-spacing: 0.5px;
        }
        .info-value {
            font-size: 18px;
            font-weight: 600;
            color: #f1f5f9;
        }

        /* Troubleshooting Panel (NEW) */
        .diagnostic-panel {
            background: #0f172ad9;
            border-radius: 28px;
            padding: 16px;
            margin-bottom: 20px;
            border-left: 4px solid #f97316;
        }
        .diag-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-weight: bold;
            color: #facc15;
            font-size: 14px;
        }
        .confidence-bar-bg {
            background: #1e293b;
            border-radius: 20px;
            height: 10px;
            overflow: hidden;
            margin: 8px 0;
        }
        .confidence-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ef4444, #facc15, #22c55e);
            border-radius: 20px;
            transition: width 0.3s;
        }
        .diag-message {
            font-size: 12px;
            color: #cbd5e1;
            margin-top: 10px;
            line-height: 1.4;
        }
        .warning-text {
            color: #f97316;
            font-weight: bold;
        }
        .calib-hint {
            color: #94a3b8;
            font-size: 11px;
            margin-top: 6px;
        }
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }
        .btn {
            flex: 1;
            background: #1e2a44;
            border: none;
            padding: 12px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .btn-primary {
            background: #2c3e66;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .btn-primary:active { background: #1f2f4f; transform: scale(0.97);}
        .btn-warning {
            background: #9b2c1d;
        }
        hr {
            margin: 16px 0;
            border-color: #334155;
        }
        .footer-buttons {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }
        @keyframes pulse-warning {
            0% { border-left-color: #f97316; }
            100% { border-left-color: #ffb347; }
        }
    </style>
</head>
<body>
<div class="app-container" id="app">
    <div class="brand">
        <h1>NEVER LOST</h1>
        <div class="tag">✧  ACCURACY MODE  ✧</div>
    </div>

    <div class="compass-panel">
        <div class="arrow-wrapper">
            <div class="compass-arrow" id="compassArrow">
                <div class="arrow-symbol" id="arrowIcon">⬆️</div>
            </div>
        </div>
        <div class="bearing-digits">
            <span>HEADING</span> <strong id="headingValue">---°</strong>
        </div>
    </div>

    <div class="info-grid">
        <div class="info-card"><div class="info-label">BEARING TO HOME</div><div class="info-value" id="bearingDisplay">---°</div></div>
        <div class="info-card"><div class="info-label">LAT</div><div class="info-value" id="latDisplay">---</div></div>
        <div class="info-card"><div class="info-label">LON</div><div class="info-value" id="lonDisplay">---</div></div>
    </div>

    <!-- 🔧 COMPASS DIAGNOSTICS + TROUBLESHOOTING (BUILT-IN) -->
    <div class="diagnostic-panel" id="diagPanel">
        <div class="diag-header">
            <span>🛰️ COMPASS HEALTH</span>
            <span id="confidencePercent">0%</span>
        </div>
        <div class="confidence-bar-bg"><div class="confidence-fill" id="confidenceFill"></div></div>
        <div class="diag-message" id="diagMessage">Checking sensors...</div>
        <div class="calib-hint" id="calibHint">⚡ Wave phone in figure-8 to calibrate</div>
        <div class="button-group">
            <button class="btn btn-primary" id="manualCalibBtn">⟳ CALIBRATE</button>
            <button class="btn" id="resetHomeBtn">🏠 RESET HOME</button>
        </div>
    </div>

    <div class="footer-buttons">
        <button class="btn" id="homeScreenBtn">HOME</button>
        <button class="btn" id="waypointsBtn">WAYPOINTS</button>
        <button class="btn" id="settingsBtn">SETTINGS</button>
    </div>
    <div style="font-size: 10px; text-align: center; margin-top: 18px; color:#2d3a55;">Set home point & navigate</div>
</div>

<script>
    // ----------------------------- NEVER LOST APP + DIAGNOSTICS -------------------------
    (function(){
        // ----- DOM Elements -----
        const arrowDiv = document.getElementById('compassArrow');
        const arrowIcon = document.getElementById('arrowIcon');
        const headingSpan = document.getElementById('headingValue');
        const bearingDisplay = document.getElementById('bearingDisplay');
        const latDisplay = document.getElementById('latDisplay');
        const lonDisplay = document.getElementById('lonDisplay');
        const confidencePercentSpan = document.getElementById('confidencePercent');
        const confidenceFillDiv = document.getElementById('confidenceFill');
        const diagMessageDiv = document.getElementById('diagMessage');
        const calibHintSpan = document.getElementById('calibHint');

        // ----- STATE -----
        let currentHeading = 0;            // 0-360 magnetic north
        let currentLat = null;
        let currentLon = null;
        let homeLat = null;
        let homeLon = null;
        
        // Diagnostic / sensor health
        let lastMagnetData = { x:0, y:0, z:0 };
        let magneticNoiseHistory = [];     // store magnitude variance
        let compassAccuracy = 0;            // 0 = unreliable, 3 = high
        let interferenceDetected = false;
        let calibrationAttempt = false;
        let currentConfidence = 0;
        
        // Geolocation watch ID
        let watchId = null;
        
        // For smoothing heading
        let headingBuffer = [];
        
        // ----- Helper: compute magnetic field magnitude variance (noise) -----
        function updateMagneticNoise(x,y,z){
            const magnitude = Math.sqrt(x*x + y*y + z*z);
            magneticNoiseHistory.push(magnitude);
            if(magneticNoiseHistory.length > 40) magneticNoiseHistory.shift();
            if(magneticNoiseHistory.length < 10) return 0;
            let sum = 0, sumSq = 0;
            for(let v of magneticNoiseHistory){ sum += v; sumSq += v*v; }
            const mean = sum / magneticNoiseHistory.length;
            const variance = (sumSq / magneticNoiseHistory.length) - (mean*mean);
            return variance; // larger variance = unstable magnetic field (interference)
        }
        
        // Confidence Score (0-100) based on accuracy, noise, GPS motion alignment
        function computeConfidence(gpsHeading, speedMps){
            let score = 50; // base
            // 1) Sensor accuracy (from deviceorientation event)
            if(compassAccuracy === 3) score += 25;
            else if(compassAccuracy === 2) score += 12;
            else if(compassAccuracy <= 1) score -= 20;
            
            // 2) Magnetic noise / interference
            const noiseVar = magneticNoiseHistory.length>10 ? 
                magneticNoiseHistory.reduce((a,b)=>a+b,0)/magneticNoiseHistory.length : 30;
            const normalizedNoise = Math.min(1, Math.max(0, (noiseVar - 30) / 100));
            if(normalizedNoise > 0.7) interferenceDetected = true;
            else interferenceDetected = false;
            score -= normalizedNoise * 35;
            
            // 3) GPS motion alignment: if moving >1 m/s compare heading vs bearing change? simpler: if speed > 0.5 we trust more
            if(speedMps > 1.2) score += 15;
            else if(speedMps < 0.3) score -= 10;  // standing still makes compass unreliable
            
            // 4) if gps heading exists & heading difference > 40 deg -> penalty
            if(gpsHeading !== undefined && gpsHeading !== null && currentHeading){
                let diff = Math.abs(gpsHeading - currentHeading);
                diff = Math.min(360-diff, diff);
                if(diff > 40) score -= 25;
                if(diff > 90) score -= 15;
            }
            
            score = Math.min(100, Math.max(0, score));
            return Math.floor(score);
        }
        
        function updateDiagnosticUI(gpsHeading, speed){
            const confidence = computeConfidence(gpsHeading, speed || 0);
            currentConfidence = confidence;
            confidencePercentSpan.innerText = `${confidence}%`;
            confidenceFillDiv.style.width = `${confidence}%`;
            
            let diagMsg = "";
            let warningFlag = false;
            if(compassAccuracy <= 1){
                diagMsg = "⚠️ Compass uncalibrated. Wave phone in figure-8 pattern.";
                warningFlag = true;
            } else if(interferenceDetected){
                diagMsg = "⚠️ Magnetic interference detected! Move away from metal/electronics.";
                warningFlag = true;
            } else if(confidence < 40){
                diagMsg = "📡 Low confidence. Try recalibrating or moving to open area.";
            } else if(confidence > 75){
                diagMsg = "✅ Compass stable & accurate. Ready to navigate.";
            } else {
                diagMsg = "🔄 Compass active. For best results, keep moving slowly.";
            }
            if(currentHeading === 0 && compassAccuracy<2) diagMsg = "🌀 No reliable heading. Calibrate compass.";
            diagMessageDiv.innerHTML = warningFlag ? `<span class="warning-text">⚠️ ${diagMsg}</span>` : diagMsg;
            
            // Add special hint if needed
            if(compassAccuracy <= 1) calibHintSpan.innerHTML = "📢 Draw figure-8's until compass stabilizes";
            else if(interferenceDetected) calibHintSpan.innerHTML = "🧲 Remove magnetic case / stay away from speakers";
            else calibHintSpan.innerHTML = "✨ Compass ready | Keep phone flat for best direction";
        }
        
        // ----- Orientation / Compass via DeviceOrientationAbsolute (or standard) -----
        function initCompass(){
            if (!window.DeviceOrientationEvent) {
                diagMessageDiv.innerText = "❌ Device orientation not supported.";
                return;
            }
            
            const handleOrientation = (event) => {
                let alpha = event.alpha; // compass heading (0-360)
                if(alpha === null || alpha === undefined) return;
                // alpha : magnetic north heading when device is held horizontally
                // if webkitCompassHeading exists (iOS)
                let heading = alpha;
                if (event.webkitCompassHeading !== undefined) {
                    heading = event.webkitCompassHeading;
                    compassAccuracy = (event.webkitCompassAccuracy !== undefined) ? (event.webkitCompassAccuracy === true ? 3 : 1) : 2;
                } else {
                    // estimate accuracy: if alpha is smooth? Not ideal but use event.absolute? 
                    if(event.absolute) compassAccuracy = 2;
                    else compassAccuracy = 1;
                }
                // normalize
                heading = Math.round(heading);
                if(heading < 0) heading += 360;
                currentHeading = heading % 360;
                
                // update arrow rotation
                arrowDiv.style.transform = `rotate(${currentHeading}deg)`;
                headingSpan.innerText = `${currentHeading}°`;
                updateBearingToHome();
                // diagnostic update with current gps heading
                if(window.lastGpsHeading !== undefined) updateDiagnosticUI(window.lastGpsHeading, window.lastSpeed);
                else updateDiagnosticUI(null, 0);
            };
            
            // request permission for iOS 13+
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                document.body.addEventListener('click', () => {
                    DeviceOrientationEvent.requestPermission()
                        .then(permissionState => {
                            if (permissionState === 'granted') {
                                window.addEventListener('deviceorientationabsolute', handleOrientation);
                                window.addEventListener('deviceorientation', handleOrientation);
                            }
                        }).catch(console.error);
                });
                calibHintSpan.innerHTML = "👉 Tap anywhere to allow compass access";
            } else {
                window.addEventListener('deviceorientationabsolute', handleOrientation);
                window.addEventListener('deviceorientation', handleOrientation);
            }
            
            // Optional: use Magnetometer API to get raw magnetic values (interference detection)
            if ('Magnetometer' in window) {
                try {
                    const magnet = new Magnetometer({ frequency: 20 });
                    magnet.addEventListener('reading', () => {
                        const x = magnet.x;
                        const y = magnet.y;
                        const z = magnet.z;
                        lastMagnetData = {x,y,z};
                        const variance = updateMagneticNoise(x,y,z);
                        if (variance > 90) interferenceDetected = true;
                        else if(variance < 40) interferenceDetected = false;
                        if(window.lastGpsHeading) updateDiagnosticUI(window.lastGpsHeading, window.lastSpeed);
                        else updateDiagnosticUI(null,0);
                    });
                    magnet.start();
                } catch(e){ console.warn("Magnetometer API error",e); }
            } else {
                // fallback: simulate noise from deviceorientation events (frequency)
                let lastTime = 0;
                window.addEventListener('deviceorientation', (e) => {
                    const now = Date.now();
                    if(lastTime && (now-lastTime) < 80) {
                        // high freq changes = potential noise
                        if(Math.random()>0.9) interferenceDetected = true;
                    }
                    lastTime = now;
                });
            }
        }
        
        // ----- Geolocation & GPS -----
        function startGPS(){
            if(!navigator.geolocation){
                latDisplay.innerText = "ERR";
                return;
            }
            watchId = navigator.geolocation.watchPosition(
                (position) => {
                    currentLat = position.coords.latitude;
                    currentLon = position.coords.longitude;
                    latDisplay.innerText = currentLat.toFixed(5);
                    lonDisplay.innerText = currentLon.toFixed(5);
                    const speed = position.coords.speed || 0;
                    let gpsHeading = null;
                    if(position.coords.heading !== null && position.coords.heading >= 0){
                        gpsHeading = position.coords.heading;
                        window.lastGpsHeading = gpsHeading;
                    }
                    window.lastSpeed = speed;
                    updateBearingToHome();
                    updateDiagnosticUI(gpsHeading, speed);
                },
                (err) => { console.warn(err); latDisplay.innerText = "no fix"; },
                { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
            );
        }
        
        // Bearing from current position to home
        function calculateBearing(lat1, lon1, lat2, lon2){
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;
            const y = Math.sin(Δλ) * Math.cos(φ2);
            const x = Math.cos(φ1)*Math.sin(φ2) -
                      Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
            let θ = Math.atan2(y, x);
            let bearing = (θ * 180/Math.PI + 360) % 360;
            return bearing;
        }
        
        function updateBearingToHome(){
            if(homeLat !== null && homeLon !== null && currentLat !== null && currentLon !== null){
                const bearing = calculateBearing(currentLat, currentLon, homeLat, homeLon);
                bearingDisplay.innerText = `${Math.round(bearing)}°`;
                // additional arrow icon orientation (optional)
                let relativeAngle = (bearing - currentHeading + 360) % 360;
                if(relativeAngle > 180) relativeAngle = 360-relativeAngle;
                if(Math.abs(relativeAngle) < 30) arrowIcon.innerText = "⬆️";
                else if(relativeAngle < 90) arrowIcon.innerText = "↗️";
                else arrowIcon.innerText = "➡️";
            } else {
                bearingDisplay.innerText = "---°";
            }
        }
        
        function setHomeToCurrent(){
            if(currentLat !== null && currentLon !== null){
                homeLat = currentLat;
                homeLon = currentLon;
                ToastMessage("Home point set");
                updateBearingToHome();
            } else {
                ToastMessage("No GPS fix");
            }
        }
        
        function resetHome(){
            homeLat = null;
            homeLon = null;
            bearingDisplay.innerText = "---°";
            ToastMessage("Home cleared");
        }
        
        function ToastMessage(msg){
            const toast = document.createElement('div');
            toast.innerText = msg;
            toast.style.position = 'fixed';
            toast.style.bottom = '80px';
            toast.style.left = '20px';
            toast.style.right='20px';
            toast.style.background='#111c2fe6';
            toast.style.color='white';
            toast.style.padding='10px';
            toast.style.borderRadius='40px';
            toast.style.textAlign='center';
            toast.style.backdropFilter='blur(12px)';
            toast.style.zIndex='999';
            document.body.appendChild(toast);
            setTimeout(()=>toast.remove(), 1800);
        }
        
        // manual calibration helper: figure 8 prompt + reset noise buffer.
        function manualCalibration(){
            magneticNoiseHistory = [];
            interferenceDetected = false;
            compassAccuracy = 1;
            diagMessageDiv.innerHTML = "🔄 Calibrating: Wave in figure-8 pattern for 10 seconds";
            calibHintSpan.innerHTML = "✋ Move your phone in a large figure-8 motion";
            setTimeout(()=>{
                if(compassAccuracy <=1) {
                    diagMessageDiv.innerHTML = "Calibration in progress, move slower...";
                } else {
                    diagMessageDiv.innerHTML = "✅ Compass recalibrated!";
                }
            }, 3000);
            // Reset confidence temporarily
            currentConfidence = 30;
            confidenceFillDiv.style.width = "30%";
            confidencePercentSpan.innerText = "30%";
        }
        
        // ----- initial UI listeners -----
        document.getElementById('manualCalibBtn').addEventListener('click', manualCalibration);
        document.getElementById('resetHomeBtn').addEventListener('click', resetHome);
        document.getElementById('homeScreenBtn').addEventListener('click', ()=> ToastMessage("🏠 Home screen"));
        document.getElementById('waypointsBtn').addEventListener('click', ()=> ToastMessage("📍 Waypoints"));
        document.getElementById('settingsBtn').addEventListener('click', ()=> ToastMessage("⚙️ Settings"));
        const setHomeBtn = document.createElement('button');
        // add set home dynamically to main UI
        const diagPanel = document.querySelector('.diagnostic-panel');
        const setHomeButton = document.createElement('button');
        setHomeButton.innerText = "📍 SET HOME HERE";
        setHomeButton.className = "btn btn-primary";
        setHomeButton.style.marginTop = "8px";
        setHomeButton.addEventListener('click', setHomeToCurrent);
        diagPanel.appendChild(setHomeButton);
        
        // Simulate accuracy improvements by using absolute events.
        window.addEventListener('deviceorientationabsolute', (e) => {
            if(e.absolute) compassAccuracy = 3;
        });
        
        // Initialization
        initCompass();
        startGPS();
        // periodic diag update as fallback
        setInterval(()=>{
            if(currentHeading) updateDiagnosticUI(window.lastGpsHeading, window.lastSpeed || 0);
        }, 800);
        
        // Check device permissions
        if (navigator.permissions && navigator.permissions.query) {
            navigator.permissions.query({ name: 'magnetometer' }).catch(()=>{});
        }
    })();
</script>
</body>
</html>
